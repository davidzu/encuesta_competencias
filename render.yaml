services:
  - type: web
    name: encuesta_competencias
    runtime: ruby
    plan: free
    buildCommand: bundle install && bin/rails assets:precompile && bin/rails db:prepare
    startCommand: bin/rails server
    healthCheckPath: /up
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: RAILS_LOG_TO_STDOUT
        value: "true"
      - key: WEB_CONCURRENCY
        value: "2"
