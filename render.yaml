databases:
  - name: encuesta_competencias_db
    databaseName: encuesta_competencias
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: encuesta_competencias
    runtime: ruby
    plan: free
    buildCommand: bundle install && bin/rails assets:precompile && bin/rails db:prepare
    startCommand: bin/rails server
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: encuesta_competencias_db
          property: connectionString
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RAILS_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: "2"
